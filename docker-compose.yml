services:
  carpool:
    build: .
    container_name: carpool
    restart: unless-stopped
    environment:
      # auto = inlogcookie alleen-https als de app via https wordt geopend; via http werkt inloggen ook.
      # 1 = inloggen alleen via https.
      COOKIE_SECURE: "${COOKIE_SECURE:-auto}"
      # https en IP-adres overnemen van de reverse proxy.
      TRUST_PROXY: "${TRUST_PROXY:-1}"
    volumes:
      - carpool-data:/data # database + geheime sleutel; blijft bewaard bij updates
    ports:
      # Standaard bereikbaar op poort 5000 van de server (alle netwerkkaarten).
      # Alleen bereikbaar maken vanaf de server zelf (proxy op dezelfde machine)? Zet CARPOOL_BIND=127.0.0.1:5000.
      - "${CARPOOL_BIND:-5000}:5000"

volumes:
  carpool-data:
